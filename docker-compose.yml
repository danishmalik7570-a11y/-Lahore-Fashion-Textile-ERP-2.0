version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Lahore Fashion Textile ERP — Docker Compose
# Services: postgres, redis, django (gunicorn), fastapi (uvicorn),
#           celery-worker, celery-beat, minio, nginx
# ─────────────────────────────────────────────────────────────────────────────

x-django-env: &django-env
  env_file:
    - .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
    MINIO_ENDPOINT: minio:9000
    PYTHONUNBUFFERED: "1"
    PYTHONDONTWRITEBYTECODE: "1"

x-django-volumes: &django-volumes
  volumes:
    - ./backend:/app
    - django_static:/app/staticfiles
    - django_media:/app/mediafiles

services:
  # ─── PostgreSQL 16 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lahorefashion}
      POSTGRES_USER: ${POSTGRES_USER:-lfuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lfpass_change_me}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lfuser} -d ${POSTGRES_DB:-lahorefashion}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - lf_network

  # ─── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lf_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_change_me}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lf_network

  # ─── MinIO (S3-compatible object storage) ──────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: lf_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_change_me}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - lf_network

  # ─── Django (Gunicorn + Uvicorn workers for ASGI/channels) ─────────────────
  django:
    build:
      context: ./backend
      dockerfile: ../infra/docker/django/Dockerfile
      target: development
    container_name: lf_django
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      MINIO_ENDPOINT: minio:9000
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app
      - django_static:/app/staticfiles
      - django_media:/app/mediafiles
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.asgi:application
               -k uvicorn.workers.UvicornWorker
               -w ${GUNICORN_WORKERS:-4}
               -b 0.0.0.0:8000
               --timeout 120
               --keep-alive 5
               --log-level info
               --access-logfile -
               --error-logfile -"
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - lf_network

  # ─── FastAPI (Uvicorn — realtime/high-frequency endpoints) ─────────────────
  fastapi:
    build:
      context: ./realtime
      dockerfile: ../infra/docker/fastapi/Dockerfile
      target: development
    container_name: lf_fastapi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DJANGO_SECRET_KEY: ${SECRET_KEY}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./realtime:/app
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8001
        --reload
        --log-level info
    ports:
      - "${FASTAPI_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - lf_network

  # ─── Celery Worker ─────────────────────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: ../infra/docker/django/Dockerfile
      target: development
    container_name: lf_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app
      - django_media:/app/mediafiles
    command: >
      celery -A config.celery_app worker
        --loglevel=info
        --concurrency=${CELERY_CONCURRENCY:-4}
        --queues=default,high_priority,reports,notifications,payroll
        --hostname=worker@%h
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lf_network

  # ─── Celery Beat (Scheduler) ───────────────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: ../infra/docker/django/Dockerfile
      target: development
    container_name: lf_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app
    command: >
      celery -A config.celery_app beat
        --loglevel=info
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
        --pidfile=/tmp/celerybeat.pid
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lf_network

  # ─── Nginx (Reverse Proxy + Static Files) ──────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: lf_nginx
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - django_static:/var/www/static:ro
      - django_media:/var/www/media:ro
      - ./frontend/web/dist:/var/www/frontend:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - django
      - fastapi
    networks:
      - lf_network

# ─── Named Volumes ──────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  django_static:
    driver: local
  django_media:
    driver: local

# ─── Networks ──────────────────────────────────────────────────────────────
networks:
  lf_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
